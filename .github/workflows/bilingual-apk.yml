name: ARVIO Bilingual APK

# Builds the sideload (plugins enabled) release APK of ARVIO Bilingual.
# - Manual: Actions → "ARVIO Bilingual APK" → Run workflow
# - Tags:   pushing a tag like v2.2-bilingual.1 also builds and publishes a GitHub Release.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   BILINGUAL_KEYSTORE_BASE64, BILINGUAL_KEYSTORE_PASSWORD, BILINGUAL_KEY_ALIAS, BILINGUAL_KEY_PASSWORD
#       Permanent signing key. Without them a TEST key kept in this repo's Actions cache is used
#       (evicted after 7 days without builds → next APK won't update the installed one).
#   TMDB_API_KEY      Your own free TMDB v3 key — needed for posters/metadata (catalogs, details).
#   TRAKT_CLIENT_ID / TRAKT_CLIENT_SECRET / MDBLIST_CLIENT_ID / SIMKL_CLIENT_ID   optional.
# No AI (Gemini/Groq) key is needed at build time: it is entered inside the app.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish a GitHub Release with the APK"
        type: boolean
        default: false
  push:
    tags:
      - "v*-bilingual*"

permissions:
  contents: write

concurrency:
  group: bilingual-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build configuration (no secrets are printed)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: |
          cp secrets.defaults.properties secrets.properties
          set_prop() { # replace or append KEY=VALUE without echoing the value
            local key="$1" value="$2"
            [ -z "$value" ] && return 0
            grep -v "^${key}=" secrets.properties > secrets.tmp || true
            printf '%s=%s\n' "$key" "$value" >> secrets.tmp
            mv secrets.tmp secrets.properties
          }
          set_prop TMDB_API_KEY "$TMDB_API_KEY"
          set_prop TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          set_prop TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          set_prop MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          set_prop SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY secret not set — catalogs/posters/details will not load in this APK."
          fi

      - name: Restore test signing key (used only when no BILINGUAL_KEYSTORE_* secrets)
        uses: actions/cache@v4
        with:
          path: ~/.arvio-bilingual-test-signing
          key: arvio-bilingual-test-signing-v1

      - name: Signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.BILINGUAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BILINGUAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BILINGUAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BILINGUAL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bilingual.keystore"
            printf '%s\n' \
              "storeFile=$RUNNER_TEMP/bilingual.keystore" \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyAlias=$KEY_ALIAS" \
              "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              > keystore.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            # TEST-ONLY key: generated once, kept in the Actions cache of this private repo
            # (never committed, never printed). GitHub evicts caches unused for 7 days; a new key
            # means the next APK can't update the installed one. Add BILINGUAL_KEYSTORE_* secrets
            # for a permanent key.
            dir="$HOME/.arvio-bilingual-test-signing"
            mkdir -p "$dir"
            if [ ! -f "$dir/test.keystore" ]; then
              pw=$(openssl rand -hex 24)
              printf '%s' "$pw" > "$dir/password"
              keytool -genkeypair -v -keystore "$dir/test.keystore" -alias arvio-bilingual-test \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass "$pw" -keypass "$pw" \
                -dname "CN=ARVIO Bilingual TEST KEY, O=Personal test build" >/dev/null 2>&1
              echo "::notice::Generated a new TEST signing key."
            fi
            pw=$(cat "$dir/password")
            echo "::add-mask::$pw"
            printf '%s\n' "storeFile=$dir/test.keystore" "storePassword=$pw" \
              "keyAlias=arvio-bilingual-test" "keyPassword=$pw" > keystore.properties
            echo "SIGNING=test" >> "$GITHUB_ENV"
            echo "Test key SHA-256: $(keytool -list -keystore "$dir/test.keystore" -storepass "$pw" -alias arvio-bilingual-test | grep -o 'SHA-256.*' || true)"
          fi

      - name: Unit tests (subtitles, incl. bilingual)
        run: |
          set -o pipefail
          if ! ./gradlew :app:testSideloadDebugUnitTest --tests 'com.arflix.tv.ui.screens.player.subtitles.*' --tests 'com.arflix.tv.offline.*' --no-daemon --stacktrace 2>&1 | tee unit-tests.log; then
            grep -E "FAILED|Exception|Error at|expected:|^e: " unit-tests.log | grep -v "^\s*at " | head -n 40 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi
          grep -E "tests completed|BUILD SUCCESSFUL" unit-tests.log | while IFS= read -r line; do echo "::notice::${line}"; done

      - name: Build sideload release APK
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleSideloadRelease -Parvio.allowMissingCloudSecrets=true --no-daemon --stacktrace 2>&1 | tee build-release.log; then
            # Surface the real cause as annotations (readable from the run page / API).
            grep -E "^e: |error:|What went wrong|Execution failed|> .*Exception|ERROR:|Missing class|R8:" build-release.log \
              | grep -v "^\s*at " | head -n 40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            grep -A8 "What went wrong" build-release.log | head -n 20 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p dist
          src=$(find app/build/outputs/apk/sideload/release -name '*.apk' | head -n1)
          name="ARVIO-Bilingual-${VERSION}-${SHORT}-${SIGNING}-signed.apk"
          cp "$src" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          {
            echo "name=$name"
            echo "version=$VERSION"
            echo "short=$SHORT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARVIO-Bilingual-apk-${{ steps.apk.outputs.short }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.short }}"
          fi
          NOTES="ARVIO Bilingual ${{ steps.apk.outputs.version }} (commit ${{ steps.apk.outputs.short }}). Signing: ${SIGNING}. See README for install notes."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ARVIO Bilingual $TAG" --notes "$NOTES" --prerelease
          fi
