name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.repository == 'ProdigyV21/ARVIO'  # ARVIO Bilingual: upstream-only job
    name: Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels based on changed paths
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
